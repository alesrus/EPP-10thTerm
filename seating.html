<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003399">
  <title>MEP seat | EPP Group</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f4f6fa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      padding: 22px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #05142b, #003399 65%, #0d47a1);
      border-bottom: 4px solid #ffcc00;
    }
    header h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    main { width: min(1120px, 100% - 24px); margin: 22px auto 42px; }
    .back-link { color: #003399; font-weight: 600; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .seat-card {
      margin-top: 16px;
      padding: clamp(16px, 3vw, 28px);
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 35, 102, 0.06);
    }
    .seat-card h2 { margin: 0 0 6px; font-size: clamp(1.25rem, 3vw, 1.75rem); }
    .seat-summary { margin: 0; color: #526174; }
    .seat-summary strong { color: #003399; }
    .profile-link { display: inline-block; margin-top: 10px; color: #003399; }
    .map-wrap { margin-top: 20px; overflow-x: auto; }
    #seatMap { display: block; width: 100%; min-width: 560px; height: auto; }
    .stage { fill: #eff4ff; stroke: #b7c8e8; stroke-width: 2; }
    .stage-label { fill: #526174; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .row-line { fill: none; stroke: #e2e8f0; stroke-width: 1.5; }
    .aisle { fill: none; stroke: #edf2f7; stroke-width: 18; }
    .aisle-center { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .seat-dot { fill: white; stroke: #7b8da8; stroke-width: 1.5; }
    .seat-dot.selected { fill: #003399; stroke: #ffcc00; stroke-width: 4; }
    .presidential-table { fill: #eff4ff; stroke: #b7c8e8; stroke-width: 2; }
    .presidential-table-label { fill: #526174; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
    .presidential-seat { fill: white; stroke: #7b8da8; stroke-width: 1.5; }
    .presidential-seat.selected { fill: #003399; stroke: #ffcc00; stroke-width: 4; }
    .legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 14px 0 0; color: #526174; font-size: 0.92rem; }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .legend-dot { width: 14px; height: 14px; border: 2px solid #7b8da8; border-radius: 50%; background: white; }
    .legend-dot.selected { border-color: #003399; background: #003399; box-shadow: 0 0 0 2px #ffcc00; }
    .legend-corridor { width: 22px; height: 0; border-top: 2px dashed #94a3b8; }
    .schematic-note { margin: 14px 0 0; color: #64748b; font-size: 0.82rem; }
    .error { color: #991b1b; }
    footer { padding: 18px; color: #64748b; text-align: center; font-size: 0.82rem; }
    @media (max-width: 600px) {
      main { width: min(100% - 16px, 1120px); margin-top: 14px; }
      .seat-card { padding: 14px 10px; }
      #seatMap { min-width: 480px; }
    }
  </style>
</head>
<body>
  <header><h1>EPP Group seat map</h1></header>
  <main>
    <a class="back-link" href="index.html">← Back to MEP directory</a>
    <section class="seat-card" aria-live="polite">
      <h2 id="mepName">Loading seat…</h2>
      <p class="seat-summary" id="seatSummary"></p>
      <a class="profile-link" id="profileLink" hidden>European Parliament profile</a>
      <div class="map-wrap">
        <svg id="seatMap" viewBox="0 0 1000 610" role="img" aria-labelledby="mapTitle mapDescription">
          <title id="mapTitle">Hemicycle seat map</title>
          <desc id="mapDescription">An empty circle represents each seat, with two corridors between seating sections. The selected MEP's seat is filled.</desc>
          <g id="presidentialTable"></g>
          <path class="stage" d="M 370 515 Q 500 575 630 515 L 615 490 Q 500 533 385 490 Z"></path>
          <text class="stage-label" x="500" y="555" text-anchor="middle">PRESIDENCY</text>
          <g id="aisles"></g>
          <g id="seatRows"></g>
        </svg>
      </div>
      <div class="legend" aria-label="Map legend">
        <span class="legend-item"><span class="legend-dot"></span>Other seats</span>
        <span class="legend-item"><span class="legend-dot selected"></span>Selected seat</span>
        <span class="legend-item"><span class="legend-corridor"></span>Corridor</span>
      </div>
      <p class="schematic-note">Schematic view: seats are arranged by the numbered rows in the room plan.</p>
    </section>
  </main>
  <footer>Group of the European People's Party · European Parliament</footer>
  <script>
    const ROOM_MAPS = {
      strasbourg: {
        name: 'Strasbourg · S1.4',
        aisleStartRow: 1,
        rows: [[1, 22], [23, 53], [54, 94], [95, 142], [143, 200], [201, 266], [267, 340]]
      },
      brussels: {
        name: 'Brussels · 2Q2',
        aisleStartRow: 0,
        rows: [[1, 13], [14, 34], [35, 61], [62, 94], [95, 131], [132, 172], [173, 217], [218, 266], [267, 318], [319, 370], [371, 413]]
      }
    };

    const params = new URLSearchParams(window.location.search);
    const room = ROOM_MAPS[params.get('room')];
    const seat = Number(params.get('seat'));
    const mepId = Number(params.get('id'));
    const mepName = params.get('name') || '';
    const location = params.get('location');
    const nameElement = document.getElementById('mepName');
    const summaryElement = document.getElementById('seatSummary');
    const aislesElement = document.getElementById('aisles');
    const rowsElement = document.getElementById('seatRows');
    const presidentialTableElement = document.getElementById('presidentialTable');
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const startAngle = 215;
    const endAngle = 325;
    const centerY = 510;
    const corridorHalfAngle = 2.2;
    const presidentialSeatNumbers = new Set([1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13]);
    const presidentialMEPIds = new Set([125670, 256865, 197711, 124802, 197402, 95074, 28229, 197514, 125104, 197534, 185341]);
    const presidentialMEPSeatById = new Map([
      [125670, 1], [256865, 2], [197711, 3], [124802, 4],
      [197402, 5], [95074, 6], [28229, 7], [197514, 10],
      [125104, 11], [197534, 12], [185341, 13]
    ]);
    const presidentialSeatNames = {
      1: 'Massimiliano SALINI',
      2: 'Eszter LAKOS',
      3: 'Dolors MONTSERRAT',
      4: 'Siegfried MUREŞAN',
      5: 'Tomas TOBÉ',
      6: 'Jeroen LENAERS',
      7: 'Manfred WEBER',
      10: 'Andrzej HALICKI',
      11: 'Romana TOMC',
      12: 'François-Xavier BELLAMY',
      13: 'Željana ZOVKO'
    };
    const roomSeatNames = {
      4: 'Andrey KOVATCHEV',
      5: 'Ana Miguel PEDRO',
      6: 'Paulo CUNHA',
      7: 'Herbert DORFMANN',
      8: 'Fulvio MARTUSCIELLO',
      9: 'Esteban GONZÁLEZ PONS',
      10: 'Christian DOLESCHAL',
      11: 'Niclas HERBST',
      12: 'Adam JARUBAS',
      13: 'Daniel BUDA',
      14: 'Iuliu WINKLER',
      15: 'Elissavet VOZEMBERG-VRIONIDI',
      16: 'Karlo RESSLER',
      17: 'Reinhold LOPATKA',
      18: 'Jessica POLFJÄRD',
      21: 'Hanna GRONKIEWICZ-WALTZ'
    };

    function pointOnArc(radius, angle) {
      const radians = angle * Math.PI / 180;
      return {
        x: 500 + radius * Math.cos(radians),
        y: centerY + radius * Math.sin(radians)
      };
    }

    function arcPath(radius, firstAngle, lastAngle) {
      const start = pointOnArc(radius, firstAngle);
      const end = pointOnArc(radius, lastAngle);
      return `M ${start.x} ${start.y} A ${radius} ${radius} 0 0 1 ${end.x} ${end.y}`;
    }

    function corridorCenters() {
      const span = endAngle - startAngle;
      return [startAngle + span / 3, startAngle + 2 * span / 3];
    }

    function rowArcSegments(hasCorridors) {
      if (!hasCorridors) return [[startAngle, endAngle]];
      const [first, second] = corridorCenters();
      return [
        [startAngle, first - corridorHalfAngle],
        [first + corridorHalfAngle, second - corridorHalfAngle],
        [second + corridorHalfAngle, endAngle]
      ];
    }

    function seatAngle(index, count, segments) {
      const availableAngle = segments.reduce((total, [first, last]) => total + last - first, 0);
      let remaining = count > 1 ? index / (count - 1) * availableAngle : availableAngle / 2;
      for (const [first, last] of segments) {
        const segmentWidth = last - first;
        if (remaining <= segmentWidth) return first + remaining;
        remaining -= segmentWidth;
      }
      return segments[segments.length - 1][1];
    }

    function showError(message) {
      nameElement.textContent = 'Seat information unavailable';
      summaryElement.textContent = message;
      summaryElement.classList.add('error');
    }

    function isListedSeat(number) {
      return room.rows.some(([first, last]) => number >= first && number <= last);
    }

    if (!room || !Number.isInteger(seat) || !isListedSeat(seat) ||
        !Number.isInteger(mepId) || mepId < 1 || !mepName) {
      showError('The room or seat link is incomplete or invalid. Return to the directory and select a seat number.');
    } else {
      nameElement.textContent = mepName;
      summaryElement.textContent = `${room.name} · Seat `;
      const seatNumber = document.createElement('strong');
      seatNumber.textContent = String(seat);
      summaryElement.append(seatNumber);

      const profileName = encodeURIComponent(mepName.trim().toUpperCase().replace(/\s+/g, '_'));
      const profileLink = document.getElementById('profileLink');
      profileLink.href = `https://www.europarl.europa.eu/meps/en/${mepId}/${profileName}/home`;
      profileLink.hidden = false;

      if (room.name.startsWith('Strasbourg')) {
        const isPresidencyMep = location === 'presidency' ||
          presidentialMEPIds.has(mepId) ||
          Object.values(presidentialSeatNames).includes(mepName);
        const table = document.createElementNS(svgNamespace, 'rect');
        table.setAttribute('class', 'presidential-table');
        table.setAttribute('x', '205');
        table.setAttribute('y', '420');
        table.setAttribute('width', '590');
        table.setAttribute('height', '62');
        table.setAttribute('rx', '31');
        presidentialTableElement.append(table);

        const tableLabel = document.createElementNS(svgNamespace, 'text');
        tableLabel.setAttribute('class', 'presidential-table-label');
        tableLabel.setAttribute('x', '500');
        tableLabel.setAttribute('y', '475');
        tableLabel.setAttribute('text-anchor', 'middle');
        tableLabel.textContent = 'PRESIDENTIAL TABLE';
        presidentialTableElement.append(tableLabel);

        for (let position = 1; position <= 13; position++) {
          if (!presidentialSeatNumbers.has(position)) continue;
          const x = 245 + (position - 1) * 42;
          const dot = document.createElementNS(svgNamespace, 'circle');
          const isSelected = isPresidencyMep &&
            (presidentialMEPSeatById.get(mepId) === position ||
              presidentialSeatNames[position] === mepName);
          dot.setAttribute('class', `presidential-seat${isSelected ? ' selected' : ''}`);
          dot.setAttribute('cx', String(x));
          dot.setAttribute('cy', '451');
          dot.setAttribute('r', isSelected ? '10' : '7');
          const seatedName = presidentialSeatNames[position];
          dot.setAttribute('aria-label', isSelected ? `Presidential table seat ${position}, ${mepName}` : `Presidential table seat ${position}, ${seatedName}`);
          const title = document.createElementNS(svgNamespace, 'title');
          title.textContent = `Presidential table · Seat ${position} · ${seatedName}${isSelected ? ' · Selected' : ''}`;
          dot.append(title);
          presidentialTableElement.append(dot);
        }
      }

      const rowCount = room.rows.length;
      const outerRadius = 420;
      const firstAisleRadius = 150 + room.aisleStartRow * (270 / Math.max(1, rowCount - 1));
      corridorCenters().forEach(angle => {
        const start = pointOnArc(firstAisleRadius, angle);
        const end = pointOnArc(outerRadius, angle);
        const path = document.createElementNS(svgNamespace, 'path');
        path.setAttribute('class', 'aisle');
        path.setAttribute('d', `M ${start.x} ${start.y} L ${end.x} ${end.y}`);
        aislesElement.append(path);
        const centerline = document.createElementNS(svgNamespace, 'path');
        centerline.setAttribute('class', 'aisle-center');
        centerline.setAttribute('d', `M ${start.x} ${start.y} L ${end.x} ${end.y}`);
        aislesElement.append(centerline);
      });

      room.rows.forEach(([first, last], rowIndex) => {
        const radius = 150 + rowIndex * (270 / Math.max(1, rowCount - 1));
        const hasCorridors = rowIndex >= room.aisleStartRow;
        const segments = rowArcSegments(hasCorridors);
        const seatCount = last - first + 1;

        segments.forEach(([firstAngle, lastAngle]) => {
          const arc = document.createElementNS(svgNamespace, 'path');
          arc.setAttribute('class', 'row-line');
          arc.setAttribute('d', arcPath(radius, firstAngle, lastAngle));
          rowsElement.append(arc);
        });

        for (let number = first; number <= last; number++) {
          const angle = seatAngle(number - first, seatCount, segments) * Math.PI / 180;
          const dot = document.createElementNS(svgNamespace, 'circle');
          const isPresidencyMep = room.name.startsWith('Strasbourg') &&
            (location === 'presidency' ||
              presidentialMEPIds.has(mepId) ||
              Object.values(presidentialSeatNames).includes(mepName));
          const isSelected = room.name.startsWith('Strasbourg')
            ? number === seat && !isPresidencyMep
            : number === seat;
          dot.setAttribute('class', `seat-dot${isSelected ? ' selected' : ''}`);
          dot.setAttribute('cx', String(500 + radius * Math.cos(angle)));
          dot.setAttribute('cy', String(centerY + radius * Math.sin(angle)));
          dot.setAttribute('r', isSelected ? '8' : '4');
          const seatedName = room.name.startsWith('Strasbourg') ? roomSeatNames[number] : null;
          dot.setAttribute('aria-label', isSelected
            ? `Seat ${number}, ${mepName}`
            : seatedName ? `Seat ${number}, ${seatedName}` : `Seat ${number}`);
          const title = document.createElementNS(svgNamespace, 'title');
          title.textContent = seatedName
            ? `Seat ${number} · ${seatedName}${isSelected ? ' · Selected' : ''}`
            : `Seat ${number}${isSelected ? ` · ${mepName}` : ''}`;
          dot.append(title);
          rowsElement.append(dot);
        }
      });
    }
  </script>
</body>
</html>
