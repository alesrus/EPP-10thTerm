<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#003399">
  <title>MEP seat | EPP Group</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f4f6fa;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header {
      padding: 22px 18px;
      color: white;
      text-align: center;
      background: linear-gradient(135deg, #05142b, #003399 65%, #0d47a1);
      border-bottom: 4px solid #ffcc00;
    }
    header h1 { margin: 0; font-size: clamp(1.3rem, 3vw, 2rem); }
    main { width: min(1120px, 100% - 24px); margin: 22px auto 42px; }
    .back-link { color: #003399; font-weight: 600; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .seat-card {
      margin-top: 16px;
      padding: clamp(16px, 3vw, 28px);
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 35, 102, 0.06);
    }
    .seat-card h2 { margin: 0 0 6px; font-size: clamp(1.25rem, 3vw, 1.75rem); }
    .seat-summary { margin: 0; color: #526174; }
    .seat-summary strong { color: #003399; }
    .seat-number { font-weight: 400; }
    .overview-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; margin-top: 10px; }
    .room-tabs { display: inline-flex; border: 1px solid #003399; border-radius: 8px; overflow: hidden; }
    .room-tabs a { padding: 8px 14px; font-weight: 600; font-size: 0.9rem; color: #003399; text-decoration: none; background: white; }
    .room-tabs a.active { color: white; background: #003399; }
    .overview-legend { display: inline-flex; flex-wrap: wrap; gap: 8px 16px; color: #526174; font-size: 0.85rem; }
    .overview-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .overview-legend .key { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 2px solid #1557b0; }
    .overview-legend .key.filled { background: #1557b0; }
    .overview-legend .key.empty { background: white; opacity: 0.6; }
    .seat.vacant { opacity: 0.45; }
    [hidden] { display: none !important; }
    .map-wrap { position: relative; margin-top: 20px; overflow-x: auto; }
    .seat { cursor: pointer; }
    .seat-tip {
      position: absolute;
      z-index: 2;
      white-space: nowrap;
      padding: 7px 11px;
      color: white;
      font-size: 0.88rem;
      line-height: 1.3;
      text-align: center;
      background: #0f172a;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.25);
      transform: translate(-50%, calc(-100% - 8px));
      pointer-events: none;
    }
    .seat-tip.below { transform: translate(-50%, 8px); }
    .seat-tip strong { display: block; font-size: 0.95rem; }
    .seat-tip span { color: #cbd5e1; font-size: 0.8rem; }
    #seatMap { display: block; width: 100%; min-width: 760px; height: auto; }
    .seat.tapped > rect:first-of-type { stroke: #003399; stroke-width: 4; }
    .seat.selected > rect:first-of-type { fill: #003399; stroke: #ffcc00; stroke-width: 4; }
    .seat.selected > rect:nth-of-type(2) { fill: #ffcc00; opacity: 1; }
    .seat.selected text { fill: white; }
    .seat-halo { fill: rgba(255, 204, 0, 0.28); stroke: #ffcc00; stroke-width: 3; }
    .error { color: #991b1b; }
    @media (max-width: 600px) {
      main { width: min(100% - 16px, 1120px); margin-top: 14px; }
      .seat-card { padding: 14px 10px; }
      #seatMap { min-width: 680px; }
    }
  </style>
</head>
<body>
  <header><h1 id="pageTitle">EPP Group seat map</h1></header>
  <main>
    <a class="back-link" href="index.html">← Back to MEP directory</a>
    <section class="seat-card" aria-live="polite">
      <h2 id="mepName">Loading seat…</h2>
      <p class="seat-summary" id="seatSummary"></p>
      <div class="overview-tools" id="overviewTools" hidden>
        <span class="room-tabs" role="group" aria-label="Room">
          <a id="tabStrasbourg" href="seating.html?room=strasbourg">Strasbourg</a>
          <a id="tabBrussels" href="seating.html?room=brussels">Brussels</a>
        </span>
        <span class="overview-legend">
          <span><i class="key filled"></i><b id="mepSeatCount">0</b> EPP MEPs</span>
          <span><i class="key empty"></i>Staff, guests, reserve</span>
        </span>
      </div>
      <div class="map-wrap">
        <svg id="seatMap" viewBox="0 0 1000 600" role="img" aria-labelledby="mapTitle mapDescription">
          <title id="mapTitle">Room seat map</title>
          <desc id="mapDescription">The official room plan with every numbered seat and the presidency row. The selected MEP's seat is highlighted.</desc>
        </svg>
        <div id="seatTip" class="seat-tip" role="status" hidden></div>
      </div>
    </section>
  </main>
  <script src="data.js?v=20261125a"></script>
  <script>
    // Room plans (SVG files in plans/). Each seat in a plan is a <g> holding a
    // box and its number; the presidency seats are told apart by their colour.
    // MEP names, seats and presidency places come from EPPGroupMEPs.csv via data.js.
    const ROOM_MAPS = {
      strasbourg: { name: 'Strasbourg · S1.4', plan: 'plans/SALLE_S1-4.svg', presidencyColour: '#6A1B9A' },
      brussels: { name: 'Brussels · 2Q2', plan: 'plans/JAN_2Q2.svg', presidencyColour: '#2B2B2B' }
    };

    const params = new URLSearchParams(window.location.search);
    const roomKey = params.get('room');
    const room = ROOM_MAPS[roomKey];
    const mepId = Number(params.get('id') || params.get('eid'));
    // Without an MEP in the link the page shows the whole room: seats of EPP
    // MEPs filled in, every other seat (staff, guests, reserve) left empty.
    const overview = !params.has('id') && !params.has('eid');
    const nameElement = document.getElementById('mepName');
    const summaryElement = document.getElementById('seatSummary');
    const mapElement = document.getElementById('seatMap');
    const svgNamespace = 'http://www.w3.org/2000/svg';
    const roomSeatElements = new Map();       // seat number -> <g> in the room
    const presidencySeatElements = new Map(); // seat number -> <g> at the presidency
    let selectedPoint = null; // plan coordinates of the selected seat
    let presidentialTableSize = 0;

    // Load the room plan into the page and index its seats.
    async function loadPlan() {
      const response = await fetch(room.plan);
      if (!response.ok) throw new Error(`Could not load ${room.plan}`);
      const plan = new DOMParser().parseFromString(await response.text(), 'image/svg+xml').documentElement;
      mapElement.setAttribute('viewBox', plan.getAttribute('viewBox'));
      mapElement.setAttribute('font-family', plan.getAttribute('font-family') || 'Inter, sans-serif');
      mapElement.replaceChildren(...[...mapElement.children].filter(el => el.matches('title, desc')),
        ...[...plan.children].map(el => document.importNode(el, true)));

      for (const group of mapElement.querySelectorAll('g[transform^="translate"]')) {
        const box = group.querySelector('rect');
        const text = group.querySelector('text');
        if (!box || !text) continue;
        const atPresidency = (box.getAttribute('stroke') || '').toUpperCase() === room.presidencyColour;
        (atPresidency ? presidencySeatElements : roomSeatElements).set(Number(text.textContent), group);
        group.classList.add('seat');
      }
      presidentialTableSize = presidencySeatElements.size;
    }

    function showError(message) {
      nameElement.textContent = 'Seat information unavailable';
      summaryElement.textContent = message;
      summaryElement.classList.add('error');
    }

    function isListedSeat(number) {
      return roomSeatElements.has(number);
    }

    function addName(map, seat, name) {
      if (!map.has(seat)) map.set(seat, []);
      map.get(seat).push(name);
    }

    // Build the selected MEP and the seat occupants from the CSV rows.
    // Without CSV data, fall back to the details carried in the link.
    function buildSeatData(meps) {
      const fromLink = {
        name: params.get('name') || '',
        seat: Number(params.get('seat')),
        location: params.get('location') === 'presidency' ? 'presidency' : 'room'
      };
      const presidentialSeats = new Map();
      const roomSeats = new Map();
      let selected = fromLink;

      for (const m of meps) {
        const seat = Number(roomKey === 'strasbourg' ? m.strasbourg : m.brussels);
        const location = roomKey === 'strasbourg' ? m.strasbourgLocation : m.brusselsLocation;
        if (m.id === mepId) selected = { name: m.name, seat, location };
        if (!Number.isInteger(seat) || seat < 1) continue;
        addName(location === 'presidency' ? presidentialSeats : roomSeats, seat, m.name);
      }

      if (meps.length === 0 && selected.location === 'presidency' && selected.name) {
        addName(presidentialSeats, selected.seat, selected.name);
      }
      return { selected, presidentialSeats, roomSeats };
    }

    function seatTitle(prefix, number, names, isSelected, selectedName) {
      const occupants = names ? names.join(' / ') : (isSelected ? selectedName : '');
      return `${prefix}${number}${occupants ? ` · ${occupants}` : ''}${isSelected ? ' · Selected' : ''}`;
    }

    // Label every seat with who sits there and highlight the selected one.
    function markSeats(roomSeats, presidentialSeats, selected) {
      const groups = [[roomSeatElements, roomSeats, 'Seat ', 'room'], [presidencySeatElements, presidentialSeats, 'Presidency · Seat ', 'presidency']];
      for (const [elements, occupants, prefix, location] of groups) {
        for (const [number, group] of elements) {
          const isSelected = selected.location === location && selected.seat === number;
          const label = seatTitle(prefix, number, occupants.get(number), isSelected, selected.name);
          group.setAttribute('aria-label', label);
          const title = document.createElementNS(svgNamespace, 'title');
          title.textContent = label;
          group.prepend(title);
          if (!isSelected) continue;
          group.classList.add('selected');
          const halo = document.createElementNS(svgNamespace, 'circle');
          halo.setAttribute('class', 'seat-halo');
          halo.setAttribute('r', '23');
          title.after(halo);
          group.parentNode.append(group); // draw it on top
          const [, x, y] = group.getAttribute('transform').match(/translate\(\s*([-\d.]+)[ ,]+([-\d.]+)/);
          selectedPoint = { x: Number(x), y: Number(y) };
        }
      }
    }

    // On narrow screens the map scrolls sideways: bring the selected seat to the middle.
    function centerOnSelectedSeat() {
      const wrap = mapElement.parentElement;
      if (!selectedPoint || wrap.scrollWidth <= wrap.clientWidth) return;
      const [viewX, , viewWidth] = mapElement.getAttribute('viewBox').split(/[\s,]+/).map(Number);
      const seatX = (selectedPoint.x - viewX) / viewWidth * mapElement.getBoundingClientRect().width;
      wrap.scrollLeft = Math.max(0, seatX - wrap.clientWidth / 2);
    }

    // Touch screens have no hover: tapping (or clicking) a seat shows who sits there.
    function showSeatTip(seat) {
      const wrap = mapElement.parentElement;
      const tip = document.getElementById('seatTip');
      document.querySelectorAll('.seat.tapped').forEach(s => s.classList.remove('tapped'));
      if (!seat) { tip.hidden = true; return; }
      seat.classList.add('tapped');
      const [where, ...names] = seat.getAttribute('aria-label').replace(' · Selected', '').split(' · ');
      const place = names.length > 1 && where === 'Presidency' ? `${where} · ${names.shift()}` : where;
      const who = document.createElement('strong');
      who.textContent = names.join(' · ') || 'No EPP MEP';
      const seatLine = document.createElement('span');
      seatLine.textContent = place;
      tip.replaceChildren(who, seatLine);
      tip.hidden = false;
      const seatBox = seat.getBoundingClientRect(), wrapBox = wrap.getBoundingClientRect();
      const top = seatBox.top - wrapBox.top + wrap.scrollTop;
      const below = top < tip.offsetHeight + 12;
      tip.classList.toggle('below', below);
      const half = tip.offsetWidth / 2 + 8;
      const x = seatBox.left + seatBox.width / 2 - wrapBox.left + wrap.scrollLeft;
      tip.style.left = `${Math.min(Math.max(x, wrap.scrollLeft + half), wrap.scrollLeft + wrap.clientWidth - half)}px`;
      tip.style.top = `${below ? top + seatBox.height : top}px`;
    }

    mapElement.addEventListener('click', event => showSeatTip(event.target.closest('g.seat')));
    document.addEventListener('click', event => {
      if (!mapElement.contains(event.target)) showSeatTip(null);
    });

    // Fill the seats of EPP MEPs with their block colour; fade the others.
    function showOccupancy(roomSeats, presidentialSeats) {
      let count = 0;
      for (const [elements, occupants] of [[roomSeatElements, roomSeats], [presidencySeatElements, presidentialSeats]]) {
        for (const [number, group] of elements) {
          const box = group.querySelector('rect');
          const text = group.querySelector('text');
          if (occupants.has(number)) {
            count++;
            box.style.fill = box.getAttribute('stroke');
            text.style.fill = '#fff';
          } else {
            box.style.fill = '#fff';
            group.classList.add('vacant');
          }
        }
      }
      return count;
    }

    async function initOverview() {
      nameElement.textContent = room.name;
      document.title = `${room.name} | EPP Group`;
      document.getElementById('overviewTools').hidden = false;
      document.getElementById(roomKey === 'strasbourg' ? 'tabStrasbourg' : 'tabBrussels').classList.add('active');
      let meps = [];
      try {
        [meps] = await Promise.all([loadMEPs(), loadPlan()]);
      } catch (err) {
        console.error(err);
        showError('The room plan could not be loaded. Check your connection and reload the page.');
        return;
      }
      const { presidentialSeats, roomSeats } = buildSeatData(meps);
      markSeats(roomSeats, presidentialSeats, { location: null });
      document.getElementById('mepSeatCount').textContent = showOccupancy(roomSeats, presidentialSeats);
      summaryElement.hidden = true;
      // On a phone the plan is wider than the screen: start in the middle.
      const wrap = mapElement.parentElement;
      wrap.scrollLeft = (wrap.scrollWidth - wrap.clientWidth) / 2;
    }

    async function init() {
      if (overview && room) return initOverview();
      if (!room || !Number.isInteger(mepId) || mepId < 1) {
        showError('The room or seat link is incomplete or invalid. Return to the directory and select a seat number.');
        return;
      }

      let meps = [];
      try {
        meps = await loadMEPs();
      } catch (err) {
        console.error('Could not load MEP data; using the details in the link.', err);
      }

      try {
        await loadPlan();
      } catch (err) {
        console.error(err);
        showError('The room plan could not be loaded. Check your connection and reload the page.');
        return;
      }

      const { selected, presidentialSeats, roomSeats } = buildSeatData(meps);
      if (!selected.name || !Number.isInteger(selected.seat) || !(selected.location === 'presidency' ? selected.seat <= presidentialTableSize : isListedSeat(selected.seat))) {
        showError('The room or seat link is incomplete or invalid. Return to the directory and select a seat number.');
        return;
      }

      markSeats(roomSeats, presidentialSeats, selected);

      // "Manfred WEBER (07)": the seat number as written on the plan, not bold.
      const seatElement = (selected.location === 'presidency' ? presidencySeatElements : roomSeatElements).get(selected.seat);
      const seatLabel = document.createElement('span');
      seatLabel.className = 'seat-number';
      seatLabel.textContent = ` (${seatElement.querySelector('text').textContent.trim()})`;
      nameElement.replaceChildren(selected.name, seatLabel);
      summaryElement.hidden = true;
      centerOnSelectedSeat();
      window.addEventListener('resize', centerOnSelectedSeat);
    }

    init();
  </script>
</body>
</html>
