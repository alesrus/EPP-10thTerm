<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a2240">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">

  <title>EPP Group in the European Parliament</title>
  <meta property="og:title" content="EPP Group in the European Parliament">
  <meta property="og:site_name" content="EPP Group">
  <meta property="og:description" content="Official Directory of the EPP Group in the European Parliament">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #003399;
      --accent: #2e60c8;
      --body-bg: #f4f6fa;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e2e8f0;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow-sm: 0 2px 6px rgba(0, 35, 102, 0.05);
      --shadow-md: 0 8px 24px rgba(0, 35, 102, 0.08);
      --transition: all 0.2s ease-in-out;
      --badge-chair: #f59e0b;
      --badge-vp: #3b82f6;
      --badge-ep-vp: #8b5cf6;
      --badge-head: #10b981;
      --badge-coord: #0d9488;
      --badge-ctte-chair: #b45309;
      --badge-seat: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--body-bg);
      color: var(--text-main);
      line-height: 1.4;
    }

    header {
      background: linear-gradient(135deg, #05142b 0%, #003399 60%, #0d47a1 100%);
      color: #fff;
      padding: 12px 52px;
      text-align: center;
      border-bottom: 4px solid #FFCC00;
      position: relative;
    }
    .settings-link {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      text-decoration: none;
    }
    .settings-link:hover { background: rgba(255, 255, 255, 0.22); }
    .mission-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 12px;
      padding: 10px 14px;
      color: #422006;
      font-size: 0.92rem;
      text-align: center;
      background: #ffcc00;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }
    .mission-banner[hidden] { display: none; }
    .mission-banner a { color: #05142b; font-weight: 700; }
    .mission-banner .mission-tag {
      padding: 3px 9px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffcc00;
      background: #05142b;
      border-radius: 999px;
    }
    .mission-banner strong { font-size: 1.02rem; }
    .badge-top {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 204, 0, 0.4);
      color: #ffe066;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: clamp(1.25rem, 2.6vw, 1.8rem);
      margin: 0;
    }
    .subtitle {
      font-size: clamp(0.85rem, 1.4vw, 1.02rem);
      color: #e0e7ff;
      max-width: 780px;
      margin: 0 auto;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 10px 50px;
    }

    /* CONTROLS BAR */
    .controls-wrapper {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-toggle {
      padding: 8px 14px;
      border: 1.5px solid var(--primary);
      background: #fff;
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: var(--transition);
    }
    .btn-toggle:hover { background: #f0f4ff; }
    .btn-toggle.active {
      background: var(--primary);
      color: #fff;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1;
      min-width: 220px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 9px 38px 9px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
      background: #f8fafc;
    }
    .search-box input:focus {
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 51, 153, 0.12);
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
    }
    .search-clear:hover { background: #e2e8f0; color: var(--primary); }
    .counter {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .counter strong { color: var(--primary); }

    /* GRID SYSTEM */
    .mep-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
    }

    .mep-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .mep-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .mep-card.chair { border-left: 4px solid var(--badge-chair); }
    .mep-card.vp { border-left: 4px solid var(--badge-vp); }
    .mep-card.ep-vp { border-left: 4px solid var(--badge-ep-vp); }

    .card-photo-container {
      width: 100%;
      aspect-ratio: 170 / 214; /* shape of the EP portrait photos: show them whole */
      position: relative;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }
    .initials-fallback {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 700;
      color: #94a3b8;
      background: #e2e8f0;
    }

    .mep-details {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 6px;
    }
    .badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }
    .badge-chair { background: #fef3c7; color: #b45309; text-transform: uppercase; }
    .badge-vp { background: #dbeafe; color: #1e40af; text-transform: uppercase; }
    .badge-ep-vp { background: #ede9fe; color: #6d28d9; border: 1px solid #8b5cf6; text-transform: uppercase; }
    .badge-head { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
    .badge-ctte-chair { background: #fffbeb; color: var(--badge-ctte-chair); border: 1px solid var(--badge-ctte-chair); text-transform: uppercase; }
    .badge-coord { background: #f0fdfa; color: #0d9488; border: 1px solid #0d9488; text-transform: uppercase; }
    .badge-seat { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    a.badge-seat { color: inherit; text-decoration: none; }
    a.badge-seat:hover,
    a.badge-seat:focus-visible { background: #dbeafe; outline: 2px solid #2563eb; outline-offset: 1px; }

    .mep-name {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 5px;
      line-height: 1.25;
    }
    .mep-name a {
      color: inherit;
      text-decoration: none;
    }
    .mep-name a:hover,
    .mep-name a:focus-visible {
      text-decoration: underline;
    }
    .flag-btn {
      padding: 0;
      font: inherit;
      font-size: 1.05em;
      line-height: 1;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .country-name {
      margin-left: 4px;
      padding: 1px 6px;
      color: #fff;
      font-weight: 600;
      background: #334155;
      border-radius: 4px;
    }
    .mep-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    #loadingState {
      text-align: center;
      padding: 50px 14px;
      font-size: 1rem;
      color: var(--text-muted);
    }


    /* MOBILE: 3 CARDS PER ROW */
    @media (max-width: 640px) {
      .container { padding: 12px 6px 40px; }
      .mep-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .card-photo-container { height: 130px; aspect-ratio: auto; }
      .mep-details { padding: 6px 4px; }
      .mep-name {
        font-size: 0.72rem;
        margin-bottom: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badge { font-size: 0.52rem; padding: 1px 3px; }
      .mep-meta { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>EPP Group in the EP</h1>
    <a class="settings-link" href="settings.html" aria-label="Settings" title="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </a>
  </header>
  <div class="mission-banner" id="missionBanner" role="status" hidden>
    <strong id="missionName"></strong>
    <span id="missionCount"></span>
    <a href="mission-seats.html">Seating →</a>
  </div>

  <div class="container">

    <div class="controls-wrapper">
      <div class="filter-buttons">
        <button id="hondAbcBtn" class="btn-toggle" onclick="setFilter('hondAbc')">HoND ABC</button>
        <button id="hondSizeBtn" class="btn-toggle" onclick="setFilter('hondSize')">HoND Size</button>
        <button id="coordCtteeProtoBtn" class="btn-toggle" onclick="setFilter('coordCtteeProto')">Coord CTTEE Proto</button>
        <button id="coordCtteeAbcBtn" class="btn-toggle" onclick="setFilter('coordCtteeAbc')">Coord CTTEE ABC</button>
        <button id="coordNameAbcBtn" class="btn-toggle" onclick="setFilter('coordNameAbc')">Coord Name ABC</button>
        <button id="ctteChairsBtn" class="btn-toggle" onclick="setFilter('ctteChairs')">CTTEE Chairs</button>
      </div>

      <div class="search-row">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="mepSearch" placeholder="Search by name, country, party, committee, seat..." oninput="onSearchInput()" onkeydown="if (event.key === 'Escape') clearSearch(); else if (event.key === 'Enter') { event.preventDefault(); this.blur(); }">
          <button type="button" id="searchClear" class="search-clear" onclick="clearSearch()" aria-label="Clear search" title="Clear search" hidden>×</button>
        </div>
        <div class="counter">
          Showing <strong id="visibleCount">0</strong> of <span id="totalCount">0</span> MEPs
        </div>
      </div>
    </div>

    <div id="loadingState">Loading MEP directory...</div>

    <div class="mep-grid" id="mepGrid" style="display: none;"></div>

  </div>


<script src="data.js?v=20261124c"></script>
  <script src="mission.js?v=20261124c"></script>
<script>
    // Safety net if an older data.js is still cached: plain matching instead of no results.
    if (typeof foldText !== 'function') window.foldText = value => String(value || '').toLowerCase();
    let meps = [];
    let mission = { enabled: false, name: '', meps: [], seats: {} };

    // In Mission mode every filter and search works only on the MEPs present.
    function baseMEPs() {
      if (!mission.enabled) return meps;
      const present = new Set(mission.meps);
      return meps.filter(m => present.has(m.id));
    }

    function showMission() {
      const banner = document.getElementById('missionBanner');
      banner.hidden = !mission.enabled;
      if (mission.enabled) {
        const count = baseMEPs().length;
        document.getElementById('missionName').textContent = mission.name || 'External meeting';
        document.getElementById('missionCount').textContent = `${count} MEP${count === 1 ? '' : 's'}`;
      }
      document.getElementById('totalCount').innerText = baseMEPs().length;
    }
    let currentFilter = 'all';

    function onSearchInput() {
      document.getElementById('searchClear').hidden = !document.getElementById('mepSearch').value;
      applyFilters();
    }

    function clearSearch() {
      const input = document.getElementById('mepSearch');
      input.value = '';
      onSearchInput();
      input.focus();
    }

    function getInitials(name) {
      return (name || '').split(' ').map(n => n[0]).filter((_, i) => i < 2).join('');
    }

    function showFallback(img) {
      img.style.display = 'none';
      const fb = img.parentElement.querySelector('.initials-fallback');
      if (fb) fb.style.display = 'flex';
    }

    function setFilter(filterType) {
      currentFilter = (currentFilter === filterType) ? 'all' : filterType;

      document.getElementById('hondAbcBtn').classList.toggle('active', currentFilter === 'hondAbc');
      document.getElementById('hondSizeBtn').classList.toggle('active', currentFilter === 'hondSize');
      document.getElementById('coordCtteeProtoBtn').classList.toggle('active', currentFilter === 'coordCtteeProto');
      document.getElementById('coordCtteeAbcBtn').classList.toggle('active', currentFilter === 'coordCtteeAbc');
      document.getElementById('coordNameAbcBtn').classList.toggle('active', currentFilter === 'coordNameAbc');
      document.getElementById('ctteChairsBtn').classList.toggle('active', currentFilter === 'ctteChairs');

      applyFilters();
    }

    function renderMEPs(list) {
      const container = document.getElementById('mepGrid');
      document.getElementById('visibleCount').innerText = list.length;

      container.innerHTML = list.map(m => {
        let roleBadge = '';
        let cardClass = m.role;
        
        if (m.role === 'chair') {
          roleBadge = `<span class="badge badge-chair">Chairman</span>`;
        } else if (m.role === 'vp') {
          if (m.roleLabel && m.roleLabel.startsWith('EP VP')) {
            cardClass = 'ep-vp';
            roleBadge = `<span class="badge badge-ep-vp">${m.roleLabel}</span>`;
          } else {
            roleBadge = `<span class="badge badge-vp">Vice-President</span>`;
          }
        }

        const headBadge = m.isHead ? `<span class="badge badge-head">HoND</span>` : '';
        const chairBadge = m.committeeChair ? `<span class="badge badge-ctte-chair" title="Chair of the ${m.committeeChair} committee">Chair-${m.committeeChair}</span>` : '';
        const coordBadge = m.coordinator ? `<span class="badge badge-coord">Coord-${m.coordinator}</span>` : '';
        const profileSlug = encodeURIComponent(m.name.trim().toUpperCase().replace(/\s+/g, '_'));
        const profileUrl = `https://www.europarl.europa.eu/meps/en/${m.id}/${profileSlug}/home`;

        const seatBadge = (seat, room, label) => {
          if (!seat || seat === '0') return '';
          const number = Number(seat);
          if (!Number.isInteger(number) || number < 1 || number >= 999) {
            return `<span class="badge badge-seat">${label}:${seat}</span>`;
          }
          const params = new URLSearchParams({
            room,
            seat: String(number),
            id: String(m.id),
            name: m.name
          });
          params.set('location', room === 'strasbourg' ? m.strasbourgLocation : m.brusselsLocation);
          return `<a class="badge badge-seat" href="seating.html?${params}" target="_blank" rel="noopener noreferrer" title="Show seat ${number} in the ${label === 'S' ? 'Strasbourg' : 'Brussels'} room">${label}:${number}</a>`;
        };
        // In Mission mode the usual Brussels/Strasbourg seats don't apply:
        // show the approximate location at the mission instead, if assigned.
        const missionSeat = mission.enabled ? mission.seats[m.id] : '';
        const strBadge = mission.enabled ? '' : seatBadge(m.strasbourg, 'strasbourg', 'S');
        const bruBadge = mission.enabled ? '' : seatBadge(m.brussels, 'brussels', 'B');
        const missionBadge = missionSeat
          ? `<a class="badge badge-seat" href="mission-seats.html" title="Approximate place at the mission: row ${missionSeat.slice(0, -1)}, ${missionSeat.endsWith('L') ? 'left' : 'right'}">${missionSeat}</a>`
          : '';

        return `
          <div class="mep-card ${cardClass}">
            <div class="card-photo-container">
              <img src="https://www.europarl.europa.eu/mepphoto/${m.id}.jpg" alt="${m.name}" referrerpolicy="no-referrer" onerror="showFallback(this)">
              <div class="initials-fallback">${getInitials(m.name)}</div>
            </div>
            <div class="mep-details">
              <div class="badges-row">
                ${roleBadge}
                ${headBadge}
                ${chairBadge}
                ${coordBadge}
                ${strBadge}
                ${bruBadge}
                ${missionBadge}
              </div>
              <div class="mep-name"><a href="${profileUrl}">${m.name}</a></div>
              <div class="mep-meta">
                <span class="country"><button type="button" class="flag-btn" title="${m.country}" aria-label="${m.country}" aria-expanded="false">${m.flag || m.country}</button><span class="country-name" hidden>${m.country}</span></span>
                ${m.party ? `<span>${m.party}</span>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function applyFilters() {
      const q = foldText(document.getElementById('mepSearch').value).trim();

      let filtered = baseMEPs().filter(m => {
        let matchesFilter = true;
        if (currentFilter === 'hondAbc' || currentFilter === 'hondSize') {
          matchesFilter = m.isHead;
        } else if (currentFilter === 'coordCtteeProto' || currentFilter === 'coordCtteeAbc' || currentFilter === 'coordNameAbc') {
          matchesFilter = !!m.coordinator;
        } else if (currentFilter === 'ctteChairs') {
          matchesFilter = !!m.committeeChair;
        }

        const matchesQuery = !q || 
          foldText(m.name).includes(q) ||
          foldText(m.country).includes(q) ||
          (m.party && foldText(m.party).includes(q)) ||
          (m.roleLabel && foldText(m.roleLabel).includes(q)) ||
          (m.coordinator && m.coordinator.toLowerCase().includes(q)) ||
          (m.committeeChair && (m.committeeChair.toLowerCase().includes(q) || 'committee chair'.includes(q))) ||
          (m.strasbourg && m.strasbourg.toString().includes(q)) ||
          (m.brussels && m.brussels.toString().includes(q)) ||
          (mission.enabled && mission.seats[m.id] && mission.seats[m.id].toLowerCase() === q) ||
          (m.isHead && "hond".includes(q)) ||
          (m.isHead && "head of delegation".includes(q));

        return matchesFilter && matchesQuery;
      });

      if (currentFilter === 'hondAbc' || currentFilter === 'coordNameAbc') {
        filtered.sort((a, b) => {
          const lastA = a.name.split(' ').pop();
          const lastB = b.name.split(' ').pop();
          return lastA.localeCompare(lastB);
        });
      } else if (currentFilter === 'hondSize') {
        filtered.sort((a, b) => {
          if (a.hondOrder !== b.hondOrder) {
            return a.hondOrder - b.hondOrder;
          }
          const lastA = a.name.split(' ').pop();
          const lastB = b.name.split(' ').pop();
          return lastA.localeCompare(lastB);
        });
      } else if (currentFilter === 'ctteChairs') {
        // EP protocol order of committees (AFET first)
        filtered.sort((a, b) => a.committeeChairOrder - b.committeeChairOrder);
      } else if (currentFilter === 'coordCtteeProto') {
        filtered.sort((a, b) => a.coordinatorOrder - b.coordinatorOrder);
      } else if (currentFilter === 'coordCtteeAbc') {
        filtered.sort((a, b) => {
          const cA = (a.coordinator || '').toLowerCase();
          const cB = (b.coordinator || '').toLowerCase();
          return cA.localeCompare(cB);
        });
      } else {
        // Default general sort: Chair (1) -> Group VPs in custom order (2) -> EP VPs 1,2,3 (3) -> Regular Members (4)
        filtered.sort((a, b) => {
          const getPriority = (m) => {
            if (m.role === 'chair') return 1;
            if (m.role === 'vp') {
              if (m.roleLabel && m.roleLabel.startsWith('EP VP')) return 3;
              return 2; // Group VP
            }
            return 4; // Regular MEP
          };

          const pA = getPriority(a);
          const pB = getPriority(b);

          if (pA !== pB) {
            return pA - pB;
          }

          if (pA === 2) {
            return a.groupVpOrder - b.groupVpOrder;
          }

          if (pA === 3) {
            return (a.roleLabel || '').localeCompare(b.roleLabel || '');
          }

          const lastA = a.name.split(' ').pop();
          const lastB = b.name.split(' ').pop();
          return lastA.localeCompare(lastB);
        });
      }

      renderMEPs(filtered);
    }

    async function loadDelegation() {
      try {
        [meps, mission] = await Promise.all([loadMEPs(), loadMission()]);

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mepGrid').style.display = 'grid';
        showMission();
        applyFilters();

      } catch (err) {
        console.error(err);
        document.getElementById('loadingState').innerHTML = `
          <p style="color: #dc2626; font-weight: 600;">Could not load data from CSV file (${MEP_CSV_URL}).</p>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">
            Please ensure both index.html and ${MEP_CSV_URL} are in the root of your GitHub repository.
          </p>`;
      }
    }

    loadDelegation();

    // Cards show only the flag: tap it to show (or hide) the country name.
    document.getElementById('mepGrid').addEventListener('click', event => {
      const flag = event.target.closest('.flag-btn');
      if (!flag) return;
      const name = flag.nextElementSibling;
      name.hidden = !name.hidden;
      flag.setAttribute('aria-expanded', String(!name.hidden));
    });

    // When the installed app comes back to the foreground, pick up mission changes.
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState !== 'visible' || !meps.length) return;
      const latest = await loadMission();
      if (JSON.stringify(latest) === JSON.stringify(mission)) return;
      mission = latest;
      showMission();
      applyFilters();
    });
  </script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
  
</body>
</html>
